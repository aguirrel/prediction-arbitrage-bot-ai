[package]
name = "prediction-arbitrage-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
kalshi-rs = "0.2.1"
polymarket-client-sdk = { version = "0.4.1", features = ["ws", "data", "clob", "ctf"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = "1"
rust_decimal_macros = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
alloy = { version = "1.4.0", features = ["signer-local", "signers"], default-features = false }
futures = "0.3"
